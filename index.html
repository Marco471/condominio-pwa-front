<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Condomínio Figueiras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <div class="top-content">
    <h1 class="title">Condomínio Figueiras</h1>
    <p class="welcome">Acesso ao sistema</p>
  </div>
</header>

<section class="home">
  <div class="card">

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="email@exemplo.com"
    >

    <label>Senha</label>
    <input
      type="password"
      id="senha"
      placeholder="********"
    >

    <button onclick="entrar()">Entrar</button>

    <div class="links">
      <a onclick="cadastrar()">Cadastrar</a>
      <a onclick="esqueciSenha()">Esqueci minha senha</a>
    </div>

  </div>
</section>

<script>
  const API_URL = "http://192.168.0.7:8000";

  async function entrar() {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if (!email || !senha) {
      alert("Preencha email e senha");
      return;
    }

    try {
      const response = await fetch(`${API_URL}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: email,
          password: senha
        })
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.detail);
        return;
      }

      window.location.href = "home.html";

    } catch (error) {
      alert("Erro ao conectar com o servidor");
      console.error(error);
    }
  }

  async function cadastrar() {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if (!email || !senha) {
      alert("Preencha email e senha para cadastrar");
      return;
    }

    try {
      const response = await fetch(`${API_URL}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: email,
          password: senha
        })
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.detail);
        return;
      }

      alert("Cadastro realizado com sucesso! Agora faça login.");

    } catch (error) {
      alert("Erro ao conectar com o servidor");
      console.error(error);
    }
  }

  function esqueciSenha() {
    alert("Recuperação de senha será implementada futuramente.");
  }
</script>

</body>
</html>
