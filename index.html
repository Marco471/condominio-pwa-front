<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Condomínio Figueiras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <div class="top-content">
    <h1 class="title">Condomínio Figueiras</h1>
    <p class="welcome">Acesso ao sistema</p>
  </div>
</header>

<section class="home">
  <div class="card login-card">

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="email@exemplo.com">
    </div>

    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••">
    </div>

    <button class="primary-btn" onclick="entrar()">Entrar</button>

    <div class="links">
      <a onclick="cadastrar()">Cadastrar</a>
      <a onclick="esqueciSenha()">Esqueci minha senha</a>
    </div>

  </div>
</section>

<script>
  // 👉 API funciona no PC (localhost) e no celular (IP da rede)
  const API_URL =
    location.hostname === "localhost" || location.hostname === "127.0.0.1"
      ? "http://127.0.0.1:8000"
      : "http://192.168.0.7:8000"; // ⚠️ confirme se este é seu IP

  async function entrar() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();

    if (!email || !senha) {
      alert("Preencha email e senha");
      return;
    }

    try {
      const response = await fetch(`${API_URL}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: senha })
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.detail || "Erro no login");
        return;
      }

      // 🔥 CORREÇÃO IMPORTANTE (funciona no celular e no PC)
      window.location.href = location.origin + "/home.html";

    } catch (e) {
      alert("Erro ao conectar com o servidor");
    }
  }

  async function cadastrar() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();

    if (!email || !senha) {
      alert("Preencha email e senha");
      return;
    }

    try {
      const response = await fetch(`${API_URL}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: senha })
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.detail || "Erro no cadastro");
        return;
      }

      alert("Cadastro realizado! Faça login.");
    } catch (e) {
      alert("Erro ao conectar com o servidor");
    }
  }

  function esqueciSenha() {
    alert("Funcionalidade em breve");
  }
</script>

</body>
</html>
