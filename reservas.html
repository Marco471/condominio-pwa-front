<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Reservas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <div class="top-content">
    <h1 class="title">Reservas</h1>
    <p class="welcome">Áreas comuns</p>
  </div>
</header>

<section class="home">
  <div class="card form-card">

    <label>Área comum</label>
    <select id="area">
      <option>Salão de festas</option>
      <option>Churrasqueira</option>
      <option>Quadra</option>
    </select>

    <label>Data</label>
    <input type="date" id="dataReserva">

    <label>Horário</label>
    <input type="time" id="horario">

    <button class="primary-btn" onclick="reservarSalao()">
      Solicitar reserva
    </button>

    <a href="home.html" class="secondary-btn">Voltar</a>

  </div>
</section>

<!-- 🔥 JS QUE FAZ FUNCIONAR -->
<script src="app.js"></script>

</body>
</html>
