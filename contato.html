<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nova mensagem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <div class="top-content">
    <h1 class="title">Nova mensagem</h1>
    <p class="welcome">Síndico</p>
  </div>
</header>

<section class="home">
  <div class="card form-card">

    <label>Assunto</label>
    <input type="text" id="assunto" placeholder="Digite o assunto">

    <label>Mensagem</label>
    <textarea id="conteudo" rows="4" placeholder="Digite sua mensagem"></textarea>

    <label class="file-label">
      📎 Anexar arquivo
      <input type="file" id="anexo" hidden>
    </label>

    <button class="primary-btn" onclick="enviarMensagem()">
      Enviar mensagem
    </button>

    <a href="home.html" class="secondary-btn">Voltar</a>

  </div>
</section>

<script src="app.js"></script>
</body>
</html>
